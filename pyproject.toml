[project]
name = "codecraftai-analysis-statistical"
version = "1.2.0"
description = "Code Craft AI Statistical Analysis Library -- SAS-comparable DATA-step semantics in Python."
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Source-Available"
authors = [{name = "Code Craft AI LLC", email = "info@code-craft.ai"}]
keywords = [
    "python",
    "statistics",
    "sas",
    "data-step",
    "automation",
    "analytics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "numpy>=2.0,<3.0.0",
    "codecraftai-foundations<2.0.0",
]

[project.urls]
Homepage = "https://github.com/code-craft-ai-company/codecraftai-analysis-statistical"
Repository = "https://github.com/code-craft-ai-company/codecraftai-analysis-statistical"
Issues = "https://github.com/code-craft-ai-company/codecraftai-analysis-statistical/issues"

[dependency-groups]
dev = [
    "ruff>=0.6,<0.7.0",
    "codecraftai-testbase<2.0.0",
]

[tool.poetry]
packages = [{include="ccai", from="source/packages"}]

[tool.poetry.dependencies]
codecraftai-foundations = {source = "codecraftai"}

[tool.poetry.group.dev.dependencies]
codecraftai-testbase = {source = "codecraftai"}

[[tool.poetry.source]]
name = "codecraftai"
url = "https://code-craft.ai/licensed-repository/simple/"
priority = "supplemental"

[[tool.uv.index]]
# Same licensed index as [[tool.poetry.source]]. Listed before PyPI so that
# codecraftai-* packages (direct and transitive) resolve from it; everything
# else falls through to PyPI. Credentials: UV_INDEX_CODECRAFTAI_USERNAME /
# UV_INDEX_CODECRAFTAI_PASSWORD, or `uv auth login`.
name = "codecraftai"
url = "https://code-craft.ai/licensed-repository/simple/"

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = ["source/examples/sasstep*.py", ".venv", "workspaces"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "B",    # bugbear (mutable defaults, etc.)
    "UP",   # pyupgrade
    "SIM",  # simplifications
]
ignore = [
    "E501",   # line length is enforced separately
    "SIM108", # ternary preference -- collides with our explicit-conditional style
    "SIM114", # combining if branches -- collides with explicit-conditional style
    "UP032",  # .format() -> f-string -- our error-message style mandates .format()+join
    "B007",   # unused loop variable -- common in indexed iteration
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
